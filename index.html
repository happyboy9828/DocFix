    <!--
      Applies the stored theme before first paint so dark-mode reloads do not
      flash light. Must stay in sync with THEME_BOOTSTRAP_SCRIPT in src/utils/theme.ts.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('docfix-theme');
          if (p !== 'light' && p !== 'dark' && p !== 'system') p = 'system';
          var d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', d);
          r.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
